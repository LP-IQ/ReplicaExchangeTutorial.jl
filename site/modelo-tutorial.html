<!doctype html>
<html lang="$idioma-html$" data-lang="$idioma$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$ · ReplicaExchangeTutorial.jl</title>
<meta name="description" content="$descricao$">
<link rel="alternate" hreflang="pt-BR" href="tutorial.html">
<link rel="alternate" hreflang="en" href="tutorial-en.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var t; try { t = localStorage.getItem("tema"); } catch (e) {}
    if (t) document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <line x1="5" y1="7" x2="27" y2="7" stroke="#ff5d4d" stroke-width="3" stroke-linecap="round"/>
        <line x1="5" y1="13" x2="27" y2="13" stroke="#f5a524" stroke-width="3" stroke-linecap="round"/>
        <line x1="5" y1="19" x2="27" y2="19" stroke="#2cc7d9" stroke-width="3" stroke-linecap="round"/>
        <line x1="5" y1="25" x2="27" y2="25" stroke="#4f8cff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="12" cy="19" r="3.6" fill="#e8473a"/>
        <circle cx="21" cy="13" r="3.6" class="walker outro"/>
      </svg>
      <span>ReplicaExchangeTutorial<span class="jl">.jl</span></span>
    </a>
    <nav class="menu" aria-label="Menu">
      <a href="index.html">$rotulo-inicio$</a>
      <a href="$pagina$" aria-current="page">Tutorial</a>
      <a href="https://github.com/LP-IQ/ReplicaExchangeTutorial.jl">GitHub</a>
    </nav>
    <div class="acoes">
      <div class="seletor-idioma" role="group" aria-label="Idioma / Language">
        <a href="tutorial.html" data-idioma="pt" hreflang="pt-BR" $if(pt)$aria-current="true"$endif$ title="Português">PT</a>
        <a href="tutorial-en.html" data-idioma="en" hreflang="en" $if(en)$aria-current="true"$endif$ title="English">EN</a>
      </div>
      <button class="botao-tema" type="button" aria-label="Tema claro ou escuro / Light or dark theme">
        <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="container tutorial">
  <details class="indice" open>
    <summary>$rotulo-indice$</summary>
    <nav aria-label="$rotulo-indice$">
$table-of-contents$
    </nav>
  </details>
  <main class="artigo">
    <div class="artigo-topo">
      <span class="sobretitulo">Tutorial · T-REMD</span>
      <h1>$title$</h1>
      <p>$subtitulo$</p>
    </div>
$body$
  </main>
</div>

<a class="voltar-topo" href="#" aria-label="$rotulo-topo$">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</a>

<footer class="rodape">
  <div class="container">
    <div>
      <p><b style="color:var(--text)">ReplicaExchangeTutorial.jl</b></p>
      <p>Lucas Avila Pinheiro · Eduard D. S. Mourão</p>
    </div>
    <div>
      <p>$rotulo-fonte$ <a href="https://github.com/LP-IQ/ReplicaExchangeTutorial.jl/blob/main/docs/$fonte$">docs/$fonte$</a></p>
      <p>MIT · <a href="https://github.com/LP-IQ/ReplicaExchangeTutorial.jl">GitHub</a></p>
    </div>
  </div>
</footer>

<script src="site.js"></script>
</body>
</html>
